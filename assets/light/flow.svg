<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 584" role="img" aria-label="Illustrative backend request flow; not live system telemetry"><title>Illustrative backend request flow; not live system telemetry</title><style>text{font-family:Consolas,monospace}.packet{stroke-dasharray:6 30;animation:flow 4s linear infinite}@keyframes flow{to{stroke-dashoffset:-144}}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.packet,.pulse{animation:none}}</style><rect width="1000" height="584" fill="#ffffff"/><text x="36" y="56" font-size="42" fill="#ae4528" text-anchor="start">02</text><text x="112" y="50" font-size="19" fill="#20272a" text-anchor="start">UNDER THE HOOD</text><path d="M112 70L964 70" fill="none" stroke="#c4cdc9"/><text x="964" y="49" font-size="14" fill="#526268" text-anchor="end">~/request-flow</text><text x="36" y="116" font-size="32" fill="#20272a" text-anchor="start" style="font-family:Georgia,serif">A request is only the beginning.</text><text x="36" y="153" font-size="15" fill="#526268" text-anchor="start">ILLUSTRATIVE FLOW / PATTERNS I WORK WITH</text><path d="M220 262H326" fill="none" stroke="#c4cdc9" stroke-width="1.5" class=""/><path d="M220 262H326" fill="none" stroke="#ae4528" stroke-width="1.5" class="packet"/><path d="M588 262H700" fill="none" stroke="#c4cdc9" stroke-width="1.5" class=""/><path d="M588 262H700" fill="none" stroke="#ae4528" stroke-width="1.5" class="packet"/><path d="M457 310V413H700" fill="none" stroke="#c4cdc9" stroke-width="1.5" class=""/><path d="M457 310V413H700" fill="none" stroke="#ae4528" stroke-width="1.5" class="packet"/><path d="M820 310V365H900V413" fill="none" stroke="#c4cdc9" stroke-width="1.5" class=""/><path d="M820 310V365H900V413" fill="none" stroke="#ae4528" stroke-width="1.5" class="packet"/><rect x="36" y="215" width="184" height="94" fill="#ffffff" stroke="#c4cdc9"/><text x="54" y="251" font-size="20" fill="#20272a" text-anchor="start">CLIENT</text><text x="54" y="283" font-size="16" fill="#526268" text-anchor="start">Web / storefront</text><rect x="326" y="215" width="262" height="94" fill="#ffffff" stroke="#ae4528"/><text x="344" y="251" font-size="20" fill="#20272a" text-anchor="start">APPLICATION</text><text x="344" y="283" font-size="16" fill="#526268" text-anchor="start">Validate · authorize</text><rect x="700" y="215" width="264" height="94" fill="#ffffff" stroke="#c4cdc9"/><text x="718" y="251" font-size="20" fill="#20272a" text-anchor="start">TRANSACTION</text><text x="718" y="283" font-size="16" fill="#526268" text-anchor="start">State + outbox event</text><rect x="700" y="413" width="264" height="94" fill="#ffffff" stroke="#c4cdc9"/><text x="718" y="449" font-size="20" fill="#20272a" text-anchor="start">BACKGROUND JOB</text><text x="718" y="481" font-size="16" fill="#526268" text-anchor="start">Queue → consumer</text><text x="267" y="241" font-size="14" fill="#526268" text-anchor="middle">API</text><text x="644" y="241" font-size="14" fill="#526268" text-anchor="middle">WRITE</text><text x="487" y="394" font-size="15" fill="#526268" text-anchor="start">async work</text><text x="36" y="387" font-size="21" fill="#526268" text-anchor="start">Idempotent payments.</text><text x="36" y="419" font-size="21" fill="#526268" text-anchor="start">Consistent transactions.</text><text x="36" y="451" font-size="21" fill="#526268" text-anchor="start">Events delivered asynchronously.</text><path d="M36 541L964 541" fill="none" stroke="#c4cdc9"/><text x="36" y="571" font-size="16" fill="#ae4528" text-anchor="start">PATTERNS: TRANSACTIONS / OUTBOX / QUEUES / IDEMPOTENCY</text></svg>