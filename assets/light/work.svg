h National</text><text x="87" y="397" font-size="18" fill="#526268" text-anchor="start">Lottery loyalty platform, with a distributed engineering team.</text><text x="87" y="425" font-size="15" fill="#ae4528" text-anchor="start">C# / .NET / CQRS / MSSQL / Azure</text><path d="M36 446L964 446" fill="none" stroke="#c4cdc9"/><text x="36" y="469" font-size="17" fill="#ae4528" text-anchor="start">03</text><text x="87" y="469" font-size="17" fill="#526268" text-anchor="start">CITITRUST</text><text x="87" y="507" font-size="29" fill="#20272a" text-anchor="start" style="font-family:Georgia,serif">Accounting with a traceable history</text><text x="87" y="543" font-size="18" fill="#526268" text-anchor="start">Led three engineers on accounting and financial workflows.</text><text x="87" y="575" font-size="18" fill="#526268" text-anchor="start">Immutable records, role-based access and detailed audit trails.</text><text x="87" y="603" font-size="15" fill="#ae4528" text-anchor="start">PHP / Transactions / Auditability</text><path d="M36 624L964 624" fill="none" stroke="#c4cdc9"/></svg>